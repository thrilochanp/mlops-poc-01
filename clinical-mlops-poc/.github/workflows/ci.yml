name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies (tesseract for OCR step)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check src tests apps

      - name: Run unit tests
        run: pytest -v

      - name: End-to-end pipeline + training + regression-gated eval smoke test
        env:
          PYTHONPATH: src
        run: |
          python -m clinical_mlops.data_pipeline.pipeline --n-per-type 10
          python -m clinical_mlops.models.train
          python -m clinical_mlops.models.evaluate --fail-on-regression

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t clinical-mlops-poc:ci .
